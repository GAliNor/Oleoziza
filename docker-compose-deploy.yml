services:
  oleoziza_frontend:
    image: <REGISTRY>/oleoziza/oleoziza-frontend:<APP_VERSION>
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile-deploy
      args:
        CURRENT_ENV: ${CURRENT_ENV}
    container_name: oleoziza_frontend_${CURRENT_ENV}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV}
    ports:
      - '${PORT_FRONTEND}:80'
    networks:
      - app-network

  oleoziza_backend:
    image: <REGISTRY>/oleoziza/oleoziza-backend:<APP_VERSION>
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile-deploy
    container_name: oleoziza_backend_${CURRENT_ENV}
    depends_on:
      oleoziza_db_backend:
        condition: service_healthy
    restart: always
    env_file:
      - ./env_files/${CURRENT_ENV}/backend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV}
    ports:
      - '${PORT_BACKEND}:8000'
    networks:
      - app-network

  oleoziza_db_backend:
    image: postgres:${POSTGRE_BACKEND_VERSION}
    container_name: oleoziza_db_${CURRENT_ENV}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${PORT_DB}:5432'
    volumes:
      - db_backend:/var/lib/postgresql/data
    networks:
      - app-network

  oleoziza_pgadmin:
    depends_on:
      - oleoziza_db_backend
    image: dpage/pgadmin4:${PGADMIN_VERSION}
    container_name: oleoziza_pgadmin_${CURRENT_ENV}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MAIL_FROM_ADDRESS}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - '${PORT_PGADMIN}:80'
    networks:
      - app-network

  oleoziza_mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION}
    container_name: oleoziza_mailhog_${CURRENT_ENV}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV}
    ports:
      - '${PORT_MAILHOG}:8025'
    networks:
      - app-network

networks:
  app-network:
    name: network-oleoziza_${CURRENT_ENV}
    driver: bridge

volumes:
  db_backend:
  pgadmin:
