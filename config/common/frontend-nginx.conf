# Hashed build assets are immutable; everything else (index.html, sw.js, manifest) must revalidate so PWA updates reach users
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    default     "no-cache";
}

server {
        listen 80;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        add_header Cache-Control $cache_control always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self';" always;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

        location / {
            try_files $uri /index.html;
        }
}
