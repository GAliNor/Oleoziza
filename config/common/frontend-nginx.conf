# Hashed build assets are immutable; everything else (index.html, sw.js, manifest) must revalidate so PWA updates reach users; API answers are never stored
map $uri $cache_control {
    ~^/assets/  "public, max-age=31536000, immutable";
    ~^/api/     "no-store";
    default     "no-cache";
}

server {
        listen 80;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Docker's embedded DNS, resolved per request so nginx starts even before the backend or RustFS is up
        resolver 127.0.0.11 valid=30s ipv6=off;

        # Proofs (photos, PDFs) and Season banners; the backend has no limit of its own yet
        client_max_body_size 10m;

        add_header Cache-Control $cache_control always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self';" always;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

        # The only public door: the backend publishes no port, the browser reaches it same-origin
        location /api/ {
            set $backend http://oleoziza_backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # RustFS buckets, path-style: the Host and path stay exactly as the browser sent them, so presigned SigV4 URLs still verify
        location ~ ^/(oleoziza-public|oleoziza-private)/ {
            set $rustfs http://oleoziza-rustfs:9000;
            proxy_pass $rustfs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_request_buffering off;
        }

        location / {
            try_files $uri /index.html;
        }
}
