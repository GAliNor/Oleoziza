# Hashed build assets and public bucket objects are immutable (every upload gets a new uuid key, so a URL never changes content); everything else (index.html, sw.js, manifest, signed private files) must revalidate so PWA updates reach users; API answers keep the backend's own Cache-Control (private, with ETags)
map $uri $cache_control {
    ~^/assets/            "public, max-age=31536000, immutable";
    ~^/oleoziza-public/   "public, max-age=31536000, immutable";
    ~^/api/               "";
    default               "no-cache";
}

# Login and invitation attempts per client IP; phones at one mill share a NAT address, hence the burst, and nothing else in the API is limited per IP
limit_req_zone $binary_remote_addr zone=auth_attempts:10m rate=10r/m;

# Caddy or Cloudflare's edge took the HTTPS connection; both reach nginx over plain HTTP inside the Docker network
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
        listen 80;
        root  /usr/share/nginx/html;
        include /etc/nginx/mime.types;

        # Docker's embedded DNS, resolved per request so nginx starts even before the backend or RustFS is up
        resolver 127.0.0.11 valid=30s ipv6=off;

        # nginx publishes no port: only Caddy (which overwrites CF-Connecting-IP with its TCP peer) or cloudflared (Cloudflare sets it) reach it over the Docker network
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        real_ip_header CF-Connecting-IP;

        # Proofs (photos, PDFs), Lot photos and Season banners, as base64 in JSON; the backend refuses a file over 10 MB
        client_max_body_size 16m;

        add_header Cache-Control $cache_control always;
        add_header Strict-Transport-Security "max-age=2592000" always;
        add_header X-Frame-Options SAMEORIGIN always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; worker-src 'self'; manifest-src 'self'; frame-ancestors 'self';" always;
        server_tokens off;

        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

        # The only way in: the backend publishes no port, the browser reaches it same-origin
        location /api/ {
            set $backend http://oleoziza_backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # Same proxy as /api/, rate-limited; no add_header here, or the server-level headers (HSTS included) would be dropped
        location ~ ^/api/auth/(login|invitations/) {
            limit_req zone=auth_attempts burst=20 nodelay;
            limit_req_status 429;
            set $backend http://oleoziza_backend:8000;
            proxy_pass $backend;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
        }

        # RustFS buckets, path-style: the Host and path stay exactly as the browser sent them, so presigned SigV4 URLs still verify
        location ~ ^/(oleoziza-public|oleoziza-private)/ {
            set $rustfs http://oleoziza-rustfs:9000;
            proxy_pass $rustfs;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_request_buffering off;
        }

        location / {
            try_files $uri /index.html;
        }
}
