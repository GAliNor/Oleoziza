services:
  oleoziza_frontend:
    container_name: oleoziza_frontend_${CURRENT_ENV:-development}
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    restart: always
    env_file:
      - ./env_files/development/frontend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '${PORT_FRONTEND:-32501}:5173'
    networks:
      - app-network

  oleoziza_backend:
    container_name: oleoziza_backend_${CURRENT_ENV:-development}
    depends_on:
      oleoziza_db_backend:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    restart: always
    env_file:
      - ./env_files/development/backend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
    volumes:
      - ./backend:/app
    ports:
      - '${PORT_BACKEND:-32551}:8000'
    networks:
      - app-network

  oleoziza_db_backend:
    image: postgres:${POSTGRE_BACKEND_VERSION:-16.2-bullseye}
    container_name: oleoziza_db_${CURRENT_ENV:-development}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '${PORT_DB:-32509}:5432'
    volumes:
      - db_backend:/var/lib/postgresql/data
    networks:
      - app-network

  oleoziza_pgadmin:
    depends_on:
      - oleoziza_db_backend
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: oleoziza_pgadmin_${CURRENT_ENV:-development}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MAIL_FROM_ADDRESS}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - '${PORT_PGADMIN:-32520}:80'
    networks:
      - app-network

  oleoziza_mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION:-latest}
    container_name: oleoziza_mailhog_${CURRENT_ENV:-development}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
    ports:
      - '${PORT_MAILHOG:-32586}:8025'
    networks:
      - app-network

networks:
  app-network:
    name: network-oleoziza_${CURRENT_ENV:-development}
    driver: bridge

volumes:
  db_backend:
  pgadmin:
