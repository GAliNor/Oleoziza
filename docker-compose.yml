services:
  oleoziza_frontend:
    container_name: oleoziza_frontend_${CURRENT_ENV:-development}
    build:
      context: .
      dockerfile: ./docker/frontend/Dockerfile
    restart: always
    env_file:
      - ./env_files/development/frontend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - '127.0.0.1:${PORT_FRONTEND:-32501}:5173'
    networks:
      - app-network

  oleoziza_backend:
    container_name: oleoziza_backend_${CURRENT_ENV:-development}
    depends_on:
      oleoziza_db_backend:
        condition: service_healthy
      oleoziza_redis:
        condition: service_healthy
      oleoziza_rustfs:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    restart: always
    env_file:
      - ./env_files/development/backend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - ./backend:/app
    ports:
      - '127.0.0.1:${PORT_BACKEND:-32551}:8000'
    networks:
      - app-network

  oleoziza_db_backend:
    image: postgres:${POSTGRE_BACKEND_VERSION:-16.2-bullseye}
    container_name: oleoziza_db_${CURRENT_ENV:-development}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 10
    ports:
      - '127.0.0.1:${PORT_DB:-32509}:5432'
    volumes:
      - db_backend:/var/lib/postgresql/data
    networks:
      - app-network

  oleoziza_pgadmin:
    depends_on:
      - oleoziza_db_backend
    image: dpage/pgadmin4:${PGADMIN_VERSION:-latest}
    container_name: oleoziza_pgadmin_${CURRENT_ENV:-development}
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${MAIL_FROM_ADDRESS}
      PGADMIN_DEFAULT_PASSWORD: ${DB_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgadmin:/var/lib/pgadmin
    ports:
      - '127.0.0.1:${PORT_PGADMIN:-32520}:80'
    networks:
      - app-network

  oleoziza_mailhog:
    image: mailhog/mailhog:${MAILHOG_VERSION:-latest}
    container_name: oleoziza_mailhog_${CURRENT_ENV:-development}
    restart: always
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
    ports:
      - '127.0.0.1:${PORT_MAILHOG:-32586}:8025'
    networks:
      - app-network

  oleoziza_redis:
    image: redis:${REDIS_VERSION:-8.10.3-alpine}
    container_name: oleoziza_redis_${CURRENT_ENV:-development}
    restart: always
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis_data:/data
    networks:
      - app-network

  oleoziza_rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.3}
    container_name: oleoziza_rustfs_${CURRENT_ENV:-development}
    restart: always
    security_opt:
      - 'no-new-privileges:true'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    healthcheck:
      test: ['CMD', 'curl', '-fsS', 'http://127.0.0.1:9000/health/ready']
      interval: 5s
      timeout: 5s
      start_period: 10s
      retries: 12
    ports:
      - '127.0.0.1:${PORT_RUSTFS_API:-32590}:9000'
      - '127.0.0.1:${PORT_RUSTFS_CONSOLE:-32591}:9001'
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      app-network:
        aliases:
          - oleoziza-rustfs

  oleoziza_worker:
    container_name: oleoziza_worker_${CURRENT_ENV:-development}
    depends_on:
      oleoziza_db_backend:
        condition: service_healthy
      oleoziza_redis:
        condition: service_healthy
      oleoziza_rustfs:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    restart: always
    entrypoint: ['watchfiles', '--filter', 'python', 'celery -A core.integrations.celery.celery_app worker --loglevel=INFO --concurrency=2', '/app']
    env_file:
      - ./env_files/development/backend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - ./backend:/app
    networks:
      - app-network

  oleoziza_flower:
    container_name: oleoziza_flower_${CURRENT_ENV:-development}
    depends_on:
      oleoziza_redis:
        condition: service_healthy
    build:
      context: .
      dockerfile: ./docker/backend/Dockerfile
    restart: always
    entrypoint: ['celery', '-A', 'core.integrations.celery.celery_app', 'flower', '--port=5555']
    env_file:
      - ./env_files/development/backend.env
    environment:
      CURRENT_ENV: ${CURRENT_ENV:-development}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    volumes:
      - ./backend:/app
    ports:
      - '127.0.0.1:${PORT_FLOWER:-32555}:5555'
    networks:
      - app-network

networks:
  app-network:
    name: network-oleoziza_${CURRENT_ENV:-development}
    driver: bridge

volumes:
  db_backend:
  pgadmin:
  redis_data:
  rustfs_data:
  rustfs_logs:
