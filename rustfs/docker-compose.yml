services:
  oleoziza_rustfs:
    image: rustfs/rustfs:${RUSTFS_VERSION:-1.0.3}
    container_name: oleoziza_rustfs_${CURRENT_ENV:-development}
    restart: always
    security_opt:
      - 'no-new-privileges:true'
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: 'true'
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY}
    ports:
      - '${PORT_RUSTFS_API:-32590}:9000'
      - '${PORT_RUSTFS_CONSOLE:-32591}:9001'
    volumes:
      - rustfs_data:/data
      - rustfs_logs:/logs
    networks:
      app-network:
        aliases:
          - oleoziza-rustfs

networks:
  app-network:
    name: network-oleoziza_${CURRENT_ENV:-development}
    external: true

volumes:
  rustfs_data:
  rustfs_logs:
