[project]
name = "oleoziza-backend"
version = "0.1.0"
description = "Oleoziza API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "fastapi==0.162.0",
    "psycopg2-binary==2.9.13",
    "pydantic-settings==2.16.2",
    "sqlalchemy==2.1.6",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "httpx2==2.16.0",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
