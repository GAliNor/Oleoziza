[project]
name = "oleoziza-backend"
version = "0.1.0"
description = "Oleoziza API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.123",
    "celery[redis]==5.6.2",
    "fastapi==0.162.0",
    "psycopg2-binary==2.9.13",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.6",
    "uuid-utils==1.2.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "flower==2.0.1",
    "httpx2==2.16.0",
    "moto[s3]==5.2.5",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
