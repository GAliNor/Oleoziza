[project]
name = "oleoziza-backend"
version = "0.1.0"
description = "Oleoziza API"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic==1.20.1",
    "boto3==1.43.123",
    "celery[redis]==5.6.2",
    "fastapi==0.162.0",
    "psycopg2-binary==2.9.13",
    "pwdlib[argon2,bcrypt]==0.3.1",
    "pydantic-settings==2.16.2",
    "pyjwt[crypto]==2.15.1",
    "python-multipart==0.0.33",
    "sqlalchemy==2.1.6",
    "uuid-utils==1.2.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "debugpy==1.8.22",
    "flower==2.0.1",
    "httpx2==2.16.0",
    "import-linter==2.16",
    "moto[s3]==5.2.5",
    "pytest==9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.importlinter]
root_packages = ["core", "modules", "seeds"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "core never imports a business module"
type = "forbidden"
source_modules = ["core"]
forbidden_modules = ["modules", "seeds"]

[[tool.importlinter.contracts]]
name = "types are the bottom layer"
type = "forbidden"
source_modules = ["modules.*.types"]
forbidden_modules = ["modules.*.models", "modules.*.services", "modules.*.business", "modules.*.helpers", "modules.*.routes", "modules.*.tasks"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "models import only types and core"
type = "forbidden"
source_modules = ["modules.*.models"]
forbidden_modules = ["modules.*.services", "modules.*.business", "modules.*.helpers", "modules.*.routes", "modules.*.tasks"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "helpers stay stateless"
type = "forbidden"
source_modules = ["modules.*.helpers"]
forbidden_modules = ["modules.*.services", "modules.*.routes", "modules.*.tasks", "fastapi"]
allow_indirect_imports = true
# auth_cookies reads and writes the refresh cookie on FastAPI's Request and Response; only auth routes call it.
ignore_imports = ["modules.auth.helpers.auth_cookies -> fastapi"]

[[tool.importlinter.contracts]]
name = "business never imports a service or FastAPI"
type = "forbidden"
source_modules = ["modules.*.business"]
forbidden_modules = ["modules.*.services", "modules.*.routes", "modules.*.tasks", "fastapi"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "services never import an entry point"
type = "forbidden"
source_modules = ["modules.*.services"]
forbidden_modules = ["modules.*.routes", "modules.*.tasks"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "routes never touch models"
type = "forbidden"
source_modules = ["modules.*.routes"]
forbidden_modules = ["modules.*.models", "sqlalchemy"]
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "only integrations import their third-party package"
type = "forbidden"
source_modules = ["modules"]
forbidden_modules = ["boto3", "botocore", "celery", "redis"]
allow_indirect_imports = true
